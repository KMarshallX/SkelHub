name: Version Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  check-version:
    name: Check dev version bump
    if: github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate version increase
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          VERSION_RE = re.compile(r"^[0-9]\.[0-9]\.[0-9]$")

          def parse_version(raw: str, source: str) -> tuple[int, str]:
              if not VERSION_RE.fullmatch(raw):
                  raise SystemExit(
                      f"{source} version must use single-digit X.Y.Z format; got {raw!r}"
                  )

              major, minor, patch = (int(part) for part in raw.split("."))
              return (100 * major) + (10 * minor) + patch, raw

          incoming_text = Path("pyproject.toml").read_text(encoding="utf-8")
          incoming_raw = tomllib.loads(incoming_text)["project"]["version"]
          incoming_value, incoming_version = parse_version(incoming_raw, "Incoming")

          base_sha = os.environ["BASE_SHA"]
          previous_text = subprocess.check_output(
              ["git", "show", f"{base_sha}:pyproject.toml"],
              text=True,
          )
          previous_raw = tomllib.loads(previous_text)["project"]["version"]
          previous_value, previous_version = parse_version(previous_raw, "Base")

          print(f"Base version: {previous_version} ({previous_value})")
          print(f"Incoming version: {incoming_version} ({incoming_value})")

          if incoming_value <= previous_value:
              raise SystemExit(
                  "Incoming version must be larger than the base main version."
              )
          PY
