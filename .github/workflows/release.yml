name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: skelhub-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release merged dev PR
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the exact merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare selected version and release notes
        id: version
        run: python scripts/release_version.py prepare
      - name: Commit version and publish tag atomically
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git fetch origin --tags
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            # A rerun can finish a release only for this exact version commit.
            test "$(git rev-parse "${TAG}^1")" = "${MERGE_SHA}"
            test "$(git rev-parse "${TAG}^{tree}")" = "$(git write-tree)"
            echo "Verified existing tag ${TAG}; continuing release creation."
          else
            git commit -m "Release ${TAG}"
            git tag "${TAG}"
            # Refuse to overwrite main if another merge advanced it meanwhile.
            git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"
          fi
      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" \
              --notes-file "${RUNNER_TEMP}/skelhub-release-notes.md"
          fi
